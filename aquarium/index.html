<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 아쿠아리움</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root {
  --deep: #0b2a4a; --deep2: #134a6e; --frame: #2f6f8f; --frame-dark: #1d4c66; --sign: #0e3d5c;
  --ink: #1f2a44; --paper: #fbfdff; --muted: #7d8ea8; --sand: #ecd9a6; --weed: #4fae7c; --ok: #5fd39a;
  --glow: #bff6ff;
}
@media (prefers-color-scheme: light) {
  :root { --deep: #8fd3f0; --deep2: #d4f1fb; --frame: #5aa9c9; --frame-dark: #3f8bab; --sign: #2f7da0; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: "Gowun Dodum", system-ui, sans-serif; color: var(--ink);
  background: linear-gradient(var(--deep), var(--deep2)) fixed; }
.rays { position: fixed; inset: 0; pointer-events: none; opacity: .18;
  background: repeating-linear-gradient(100deg, transparent 0 60px, #ffffff 60px 70px, transparent 70px 150px); }
main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; position: relative; }
.sign { background: var(--sign); color: var(--paper); border-radius: 22px 22px 0 0; padding: 14px 22px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sign h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 30px; margin: 0; }
.sign p { margin: 0; font-size: 14px; opacity: .9; }
.hall { background: var(--frame); padding: 14px; border: 6px solid var(--frame-dark); border-top: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.zone { grid-column: 1 / -1; font-family: "Jua", sans-serif; color: var(--paper); opacity: .85; font-size: 14px; margin: 2px 4px -4px; }

/* 수조 */
.tank { position: relative; height: 200px; border-radius: 14px; overflow: hidden; cursor: pointer;
  background: linear-gradient(var(--water) 0%, color-mix(in srgb, var(--water) 60%, #0b2a4a) 100%);
  border: 5px solid var(--frame-dark); box-shadow: inset 0 0 0 2px #ffffff55; outline-offset: 3px; transition: filter .6s; }
.tank:focus-visible { outline: 3px solid var(--glow); }
.tank::before { content: ""; position: absolute; inset: 0 0 auto; height: 8px; background: #ffffff40; }
.tank.idle { filter: brightness(.5) saturate(.55); }
.tank.working::after { content: ""; position: absolute; top: 0; left: 15%; right: 15%; height: 80px;
  background: radial-gradient(ellipse at top, #ffffffa0, transparent 70%); pointer-events: none; }
.plate { position: absolute; top: 10px; left: 10px; background: var(--paper); border-radius: 10px; padding: 2px 9px;
  font-family: "Jua", sans-serif; font-size: 15px; z-index: 3; }
.plate small { font-family: "Gowun Dodum", sans-serif; color: var(--muted); font-size: 12px; }
.count { position: absolute; top: 10px; right: 10px; background: var(--glow); border-radius: 99px; padding: 1px 8px;
  font-family: "Jua", sans-serif; font-size: 13px; z-index: 3; }
.sand { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: var(--sand);
  border-radius: 50% 50% 0 0 / 14px 14px 0 0; }
.weed { position: absolute; bottom: 20px; width: 22px; height: 70px; }
.weed.a { left: 10px; } .weed.b { right: 14px; height: 52px; }
.tank.working .weed { animation: sway 3s ease-in-out infinite alternate; transform-origin: bottom; }
@keyframes sway { to { transform: skewX(-8deg); } }
.clam { position: absolute; bottom: 22px; left: calc(50% + 10px); width: 48px; height: 40px; }
.clam .lid { position: absolute; left: 4px; right: 4px; top: 0; height: 26px; border-radius: 10px 10px 4px 4px;
  background: #f7c8d8; border: 3px solid var(--ink); }
.clam .base { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; border-radius: 4px 4px 20px 20px;
  background: #f3b3c8; border: 3px solid var(--ink); }
.tank.working .clam .lid { background: var(--glow); box-shadow: 0 0 14px var(--glow); }
.pal { position: absolute; bottom: 20px; left: calc(50% - 58px); width: 66px; height: 66px; z-index: 2; }
.pal svg { width: 100%; height: 100%; overflow: visible; }
.pal .ec { display: none; }
.tank.idle .pal .eo { display: none; } .tank.idle .pal .ec { display: inline; }
.tank.working .pal { animation: type .45s ease-in-out infinite alternate; }
.tank.idle .pal { animation: doze 3s ease-in-out infinite; }
@keyframes type { to { transform: translateY(-3px) rotate(-4deg); } }
@keyframes doze { 50% { transform: translateY(2px); } }
.bub { position: absolute; bottom: 60px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid #ffffffcc; opacity: 0; }
.tank.working .bub { animation: rise 3.2s linear infinite; }
.bub.b1 { left: 30%; } .bub.b2 { left: 62%; animation-delay: 1.1s !important; width: 6px; height: 6px; }
.bub.b3 { left: 78%; animation-delay: 2.2s !important; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-120px); opacity: 0; } }
.zzz { position: absolute; bottom: 92px; left: calc(50% - 30px); font-family: "Jua", sans-serif; color: var(--paper);
  font-size: 15px; display: none; z-index: 2; }
.tank.idle .zzz { display: block; animation: float 2.6s ease-in-out infinite; }
@keyframes float { 50% { transform: translate(6px, -8px); opacity: .6; } }
.say { position: absolute; left: 10px; right: 10px; top: 42px; background: var(--paper); border-radius: 14px;
  padding: 6px 10px; font-size: 13px; line-height: 1.35; z-index: 3; display: none;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tank.working .say { display: -webkit-box; }
.say small { color: var(--muted); }
.check { position: absolute; bottom: 96px; right: 14px; background: var(--ok); color: #fff; border-radius: 50%;
  width: 26px; height: 26px; display: none; place-items: center; font-weight: 700; z-index: 3; }
.tank.fresh .check { display: grid; }

.meet { grid-column: 1 / -1; border-radius: 14px; border: 5px solid var(--frame-dark); padding: 12px 14px 16px;
  background: linear-gradient(#bfe6f5, #9fd0ea); position: relative; }
.meet-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.meet-head button { font: inherit; font-size: 13px; border: 2px solid var(--frame-dark); background: var(--paper); color: var(--ink);
  border-radius: 99px; padding: 2px 10px; cursor: pointer; }
.meet-head button[aria-pressed="true"] { background: var(--sign); color: var(--paper); border-color: var(--sign); }
.chat { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-height: 420px; overflow: auto; }
.chat li { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
.chat li.right { margin-left: auto; flex-direction: row-reverse; }
.chat svg { width: 44px; height: 44px; flex: none; }
.chat .msg { background: var(--paper); border-radius: 16px 16px 16px 4px; padding: 7px 11px; font-size: 14px; line-height: 1.45; }
.chat li.right .msg { border-radius: 16px 16px 4px 16px; background: #fffbe8; }
.chat .who { font-family: "Jua", sans-serif; font-size: 13px; color: var(--muted); display: block; margin-bottom: 2px; }
.chat .kind { display: inline-block; font-size: 12px; background: #e3f1fa; border-radius: 6px; padding: 0 6px; margin-left: 4px; }
.guests { margin-left: auto; display: flex; gap: 6px; }
.lobby { grid-column: 1 / -1; min-height: 70px; background: #00000026; border-radius: 12px; padding: 10px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--paper); font-size: 14px; }
.guest { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); color: var(--ink); border-radius: 99px; padding: 3px 12px 3px 4px; }
.guest svg { width: 26px; height: 26px; }
.base { height: 18px; background: var(--frame-dark); border-radius: 0 0 12px 12px; }
section.log { margin-top: 26px; background: var(--paper); border-radius: 18px; padding: 16px 20px; }
.log h2 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 22px; margin: 0 0 8px; }
.log ol { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
.log li { padding: 6px 0; border-bottom: 1px dashed #d8e4ee; font-size: 14px; display: flex; gap: 10px; }
.log time { color: var(--muted); min-width: 44px; }
.log b { font-family: "Jua", sans-serif; font-weight: 400; }
.empty { color: var(--muted); }
dialog { border: 0; border-radius: 18px; max-width: 560px; width: calc(100% - 32px); padding: 18px 20px; background: var(--paper); color: var(--ink); }
dialog header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
dialog header svg { width: 48px; height: 48px; }
dialog h3 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 22px; margin: 0; }
dialog article { border-top: 1px dashed #d8e4ee; padding: 8px 0; font-size: 14px; }
dialog pre { white-space: pre-wrap; font: inherit; background: #eef5fb; border-radius: 8px; padding: 8px; margin: 6px 0 0; max-height: 160px; overflow: auto; }
dialog button { font: inherit; border: 0; background: var(--sign); color: var(--paper); border-radius: 10px; padding: 6px 14px; cursor: pointer; }
@media (max-width: 760px) { .hall { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { .tank .pal, .tank .zzz, .tank .bub, .tank .weed { animation: none !important; } }
</style>
</head>
<body>
<div class="rays"></div>
<main>
  <header class="sign">
    <h1>에이전트 아쿠아리움</h1>
    <p><span id="summary">불러오는 중</span> <small id="tick" style="opacity:.6;margin-left:8px"></small></p>
  </header>
  <div class="hall" id="hall"></div>
  <div class="base"></div>
  <section class="log">
    <h2>오늘의 사육 일지</h2>
    <ol id="log"></ol>
  </section>
</main>
<dialog id="detail"></dialog>
<script>
const K = "#1f2a44";
// 눈: 뜬 눈(eo)·감은 눈(ec). 쉬는 수조에서는 CSS가 감은 눈만 보여 준다
const eyes = (x1, x2, y, r = 3.2) => `<g class="eo" fill="${K}"><circle cx="${x1}" cy="${y}" r="${r}"/><circle cx="${x2}" cy="${y}" r="${r}"/>
  <circle cx="${x1 + 1}" cy="${y - 1.2}" r="1" fill="#fff"/><circle cx="${x2 + 1}" cy="${y - 1.2}" r="1" fill="#fff"/></g>
  <g class="ec" stroke="${K}" stroke-width="2" fill="none" stroke-linecap="round"><path d="M${x1 - 3} ${y} q3 2.5 6 0"/><path d="M${x2 - 3} ${y} q3 2.5 6 0"/></g>`;
const blush = (x1, x2, y) => `<ellipse cx="${x1}" cy="${y}" rx="3.5" ry="2" fill="#ff9fb4" opacity=".7"/><ellipse cx="${x2}" cy="${y}" rx="3.5" ry="2" fill="#ff9fb4" opacity=".7"/>`;
const S = (inner) => `<svg viewBox="0 0 64 64" aria-hidden="true" stroke-linejoin="round">${inner}</svg>`;
const ANIMAL = {
  penguin: S(`<ellipse cx="32" cy="38" rx="18" ry="22" fill="#2d3350" stroke="${K}" stroke-width="2.5"/>
    <ellipse cx="32" cy="42" rx="12" ry="15" fill="#fff"/><ellipse cx="32" cy="29" rx="12" ry="9" fill="#fff"/>
    <path d="M28 32 l4 4 l4 -4 z" fill="#ffab3d" stroke="${K}" stroke-width="1.5"/>
    <ellipse cx="24" cy="60" rx="6" ry="3" fill="#ffab3d"/><ellipse cx="40" cy="60" rx="6" ry="3" fill="#ffab3d"/>
    ${eyes(26, 38, 27, 2.8)}${blush(22, 42, 33)}`),
  dolphin: S(`<path d="M30 12 q6 4 6 10" fill="#5e9fd6" stroke="${K}" stroke-width="2.5"/>
    <ellipse cx="32" cy="36" rx="19" ry="18" fill="#7ab6e8" stroke="${K}" stroke-width="2.5"/>
    <ellipse cx="32" cy="44" rx="12" ry="9" fill="#cfe8fb"/><ellipse cx="32" cy="46" rx="7" ry="4" fill="#a9d3f5" stroke="${K}" stroke-width="1.5"/>
    <path d="M12 40 q-6 2 -6 8 q6 -1 9 -4" fill="#5e9fd6" stroke="${K}" stroke-width="2"/>
    ${eyes(25, 39, 33)}${blush(20, 44, 40)}`),
  octopus: S(`<g fill="#ff8fb1" stroke="${K}" stroke-width="2.5">
    <path d="M18 40 q-4 12 -10 14 q8 2 14 -8"/><path d="M26 44 q-2 10 -6 16 q8 -2 10 -12"/>
    <path d="M38 44 q2 10 6 16 q-8 -2 -10 -12"/><path d="M46 40 q4 12 10 14 q-8 2 -14 -8"/>
    <ellipse cx="32" cy="30" rx="18" ry="17"/></g>
    <circle cx="24" cy="20" r="2.5" fill="#ffc2d4"/><circle cx="41" cy="18" r="2" fill="#ffc2d4"/>
    ${eyes(25, 39, 31)}${blush(20, 44, 37)}<path d="M29 38 q3 3 6 0" stroke="${K}" stroke-width="2" fill="none" stroke-linecap="round"/>`),
  turtle: S(`<ellipse cx="32" cy="46" rx="22" ry="13" fill="#6fae6a" stroke="${K}" stroke-width="2.5"/>
    <path d="M22 38 l10 -4 l10 4 l-2 10 h-16 z M22 38 l-8 6 M42 38 l8 6 M24 48 l-6 6 M40 48 l6 6" fill="none" stroke="#3f7d44" stroke-width="2"/>
    <circle cx="32" cy="24" r="12" fill="#b8dc8a" stroke="${K}" stroke-width="2.5"/>
    ${eyes(27, 37, 23, 2.6)}${blush(23, 41, 28)}<path d="M29 29 q3 2 6 0" stroke="${K}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`),
  seal: S(`<ellipse cx="12" cy="46" rx="7" ry="4" fill="#b7c2cd" stroke="${K}" stroke-width="2" transform="rotate(-25 12 46)"/>
    <ellipse cx="52" cy="46" rx="7" ry="4" fill="#b7c2cd" stroke="${K}" stroke-width="2" transform="rotate(25 52 46)"/>
    <ellipse cx="32" cy="38" rx="20" ry="20" fill="#d9e1e8" stroke="${K}" stroke-width="2.5"/>
    <circle cx="22" cy="24" r="1.6" fill="#a8b4c0"/><circle cx="44" cy="22" r="2" fill="#a8b4c0"/><circle cx="46" cy="50" r="1.8" fill="#a8b4c0"/>
    ${eyes(24, 40, 33, 4)}<circle cx="29" cy="41" r="4" fill="#fff"/><circle cx="35" cy="41" r="4" fill="#fff"/>
    <ellipse cx="32" cy="38.5" rx="2.4" ry="1.7" fill="${K}"/>
    <g stroke="${K}" stroke-width="1.2" stroke-linecap="round"><path d="M26 41 h-8 M26 43 l-7 2 M38 41 h8 M38 43 l7 2"/></g>${blush(19, 45, 38)}`),
  otter: S(`<circle cx="18" cy="20" r="5" fill="#8a5a3a" stroke="${K}" stroke-width="2"/><circle cx="46" cy="20" r="5" fill="#8a5a3a" stroke="${K}" stroke-width="2"/>
    <ellipse cx="32" cy="38" rx="19" ry="20" fill="#9b6a45" stroke="${K}" stroke-width="2.5"/>
    <ellipse cx="32" cy="37" rx="13" ry="11" fill="#ecd3b3"/>
    ${eyes(26, 38, 31, 2.8)}<ellipse cx="32" cy="37" rx="3.4" ry="2.4" fill="${K}"/>
    <path d="M29 41 q3 3 6 0" stroke="${K}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <g stroke="${K}" stroke-width="1.1" stroke-linecap="round"><path d="M24 38 h-7 M24 40 l-6 2 M40 38 h7 M40 40 l6 2"/></g>
    <ellipse cx="24" cy="52" rx="5" ry="4" fill="#8a5a3a" stroke="${K}" stroke-width="2"/><ellipse cx="40" cy="52" rx="5" ry="4" fill="#8a5a3a" stroke="${K}" stroke-width="2"/>
    ${blush(21, 43, 36)}`),
  jelly: S(`<g stroke="#c98ae0" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M22 40 q-3 8 1 14 q-4 4 -1 8"/><path d="M30 42 q3 8 -1 13 q3 4 0 8"/><path d="M38 42 q-3 8 1 13 q-3 4 0 8"/><path d="M46 40 q3 8 -1 14 q4 4 1 8"/></g>
    <path d="M12 38 q0 -24 20 -24 q20 0 20 24 q-5 4 -10 0 q-5 4 -10 0 q-5 4 -10 0 q-5 4 -10 0 z" fill="#f3c2ff" fill-opacity=".9" stroke="${K}" stroke-width="2.5"/>
    <ellipse cx="24" cy="22" rx="4" ry="2.5" fill="#fff" opacity=".7"/>${eyes(26, 38, 30)}${blush(21, 43, 35)}`),
  hamster: S(`<ellipse cx="32" cy="58" rx="20" ry="5" fill="#8a97a8" stroke="${K}" stroke-width="2"/>
    <ellipse cx="32" cy="46" rx="17" ry="13" fill="#f2a65a" stroke="${K}" stroke-width="2.5"/><ellipse cx="32" cy="49" rx="10" ry="8" fill="#fff1dc"/>
    <circle cx="21" cy="21" r="5" fill="#f2a65a" stroke="${K}" stroke-width="2"/><circle cx="43" cy="21" r="5" fill="#f2a65a" stroke="${K}" stroke-width="2"/>
    <circle cx="21" cy="21" r="2.2" fill="#ffb3c1"/><circle cx="43" cy="21" r="2.2" fill="#ffb3c1"/>
    <ellipse cx="32" cy="32" rx="14" ry="12" fill="#f2a65a" stroke="${K}" stroke-width="2.5"/><ellipse cx="32" cy="36" rx="9" ry="6" fill="#fff1dc"/>
    ${eyes(26, 38, 30, 2.6)}<ellipse cx="32" cy="34" rx="1.8" ry="1.3" fill="${K}"/>
    <path d="M30 37 q2 2 4 0" stroke="${K}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="21" cy="37" rx="5" ry="3.5" fill="#ffb3c1" opacity=".75"/><ellipse cx="43" cy="37" rx="5" ry="3.5" fill="#ffb3c1" opacity=".75"/>
    <circle cx="32" cy="29" r="21" fill="#dff6ff" fill-opacity=".28" stroke="#9fd9ef" stroke-width="3"/>
    <path d="M18 18 q6 -8 16 -9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>
    <rect x="13" y="45" width="38" height="7" rx="3.5" fill="#b9c4d2" stroke="${K}" stroke-width="2"/>
    <circle cx="20" cy="48.5" r="1.4" fill="${K}"/><circle cx="32" cy="48.5" r="1.4" fill="${K}"/><circle cx="44" cy="48.5" r="1.4" fill="${K}"/>`),
  star: S(`<path d="M32 6 l7 16 l17 2 l-13 11 l4 17 l-15 -9 l-15 9 l4 -17 l-13 -11 l17 -2 z" fill="#ff9a7a" stroke="${K}" stroke-width="2.5"/>${eyes(27, 37, 30, 2.4)}${blush(24, 40, 35)}`),
};
const WEED = `<svg class="weed a" viewBox="0 0 22 70"><path d="M11 70 q-10 -12 0 -24 q10 -12 0 -24 q-8 -10 0 -22" stroke="var(--weed)" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
  <svg class="weed b" viewBox="0 0 22 70"><path d="M11 70 q10 -14 0 -28 q-10 -14 0 -28" stroke="var(--weed)" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;

// 에이전트 이름 순서대로 동물·물색을 돌려 쓴다. 정의 파일이 없는 에이전트(general-purpose 등)는 회의 수조의 손님 불가사리.
const PALS = [["penguin", "펭귄", "#9fdcf5"], ["dolphin", "돌고래", "#8fcff0"], ["octopus", "문어", "#a9c9f5"], ["turtle", "거북이", "#9fe0cf"],
              ["seal", "물범", "#8fc0e6"], ["otter", "수달", "#8fd9d2"], ["jelly", "해파리", "#b3b8f2"], ["hamster", "햄스터", "#9fd8f0"]];
let TANKS = [];
function build(roles) {
  TANKS = [["수조", roles.map((r, i) => { const [key, animal, water] = PALS[i % PALS.length]; return [r, r, animal, key, water]; })]];
  INFO = Object.fromEntries(TANKS.flatMap(([, t]) => t.map(x => [x[0], x])));
}
let INFO = {};
const hm = ts => (ts || "").slice(11, 16);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const who = type => INFO[type] ? `${INFO[type][1]} ${INFO[type][2]}` : (type || "손님 불가사리");
let last = { agents: [], log: [] };

function tank([type, role, animal, key, water]) {
  const mine = last.agents.filter(a => a.type === type);
  const busy = mine.filter(a => a.status === "working");
  const recent = mine.filter(a => a.status === "done").at(-1);
  const fresh = !busy.length && recent && Date.now() - new Date(recent.ended) < 10 * 60e3;
  const now = busy.at(-1);
  return `<div class="tank ${busy.length ? "working" : "idle"} ${fresh ? "fresh" : ""}" tabindex="0" role="button"
      data-type="${type}" style="--water:${water}" aria-label="${role} ${animal} 수조, ${busy.length ? "일하는 중" : "쉬는 중"}">
    <span class="plate">${role} <small>${animal}</small></span>${busy.length > 1 ? `<span class="count">${busy.length}마리 일하는 중</span>` : ""}
    <div class="say">${now ? `${esc(now.task)} <small>${hm(now.started)}부터</small>` : ""}</div>
    ${WEED}<i class="bub b1"></i><i class="bub b2"></i><i class="bub b3"></i>
    <div class="zzz">z z</div><div class="check" title="방금 끝냄">✓</div>
    <div class="pal">${ANIMAL[key]}</div><div class="clam"><div class="lid"></div><div class="base"></div></div>
    <div class="sand"></div></div>`;
}

function render() {
  const guests = last.agents.filter(a => !INFO[a.type] && a.status === "working");
  document.getElementById("hall").innerHTML = TANKS.map(([zone, t]) => `<div class="zone">${zone}</div>` + t.map(tank).join("")).join("")
    + `<div class="zone">회의 수조</div><div class="meet">${meet(guests)}</div>`;
  const n = last.agents.filter(a => a.status === "working").length;
  document.getElementById("summary").textContent = n ? `지금 ${n}마리가 일하고 있어요` : "모두 쉬는 중이에요";
  document.getElementById("log").innerHTML = last.log.length
    ? last.log.map(l => `<li><time>${hm(l.ts)}</time><span><b>${esc(who(l.type))}</b> ${l.what} · ${esc(l.task)}</span></li>`).join("")
    : `<li class="empty">아직 기록이 없어요. 서브에이전트가 일을 시작하면 여기에 쌓여요.</li>`;
}

let pick = null;  // 고른 스레드 id(없으면 가장 최근)
function meet(guests) {
  const talks = last.talks || [];
  if (!talks.length) return `<p class="empty">회의 기록이 없어요. AQUARIUM_THREADS를 설정하면 리뷰 스레드가 여기 보여요.</p>`;
  const t = talks.find(x => x.id === pick) || talks[0];
  const first = t.posts[0]?.who;
  const head = talks.map(x => `<button data-thread="${esc(x.id)}" aria-pressed="${x.id === t.id}">${esc(x.id.slice(11))}</button>`).join("")
    + (guests.length ? `<span class="guests" title="역할 밖 도우미">${guests.map(g => `<span class="guest">${ANIMAL.star}${esc(g.task)}</span>`).join("")}</span>` : "");
  const rows = t.posts.map(p => { const info = INFO[p.who]; const key = info ? info[3] : "star";
    return `<li class="${p.who === first ? "" : "right"}">${ANIMAL[key]}<div class="msg" title="${esc(p.gist)}"><span class="who">${esc(who(p.who))} · ${esc(p.time)}<span class="kind">${esc(p.kind)}</span></span>${esc(p.say || p.gist)}</div></li>`; }).join("");
  return `<div class="meet-head">${head}</div><ol class="chat">${rows}</ol>`;
}

function open(type) {
  const [, role, animal, key] = INFO[type];
  const mine = last.agents.filter(a => a.type === type).slice(-6).reverse();
  const d = document.getElementById("detail");
  d.innerHTML = `<header>${ANIMAL[key]}<h3>${role} ${animal}의 수조</h3></header>${mine.length ? mine.map(a => `<article>
      <b>${a.status === "working" ? "일하는 중" : "끝냄"}</b> ${hm(a.started)}${a.ended ? "–" + hm(a.ended) : ""} · ${esc(a.task)}
      ${a.result ? `<pre>${esc(a.result)}</pre>` : a.prompt ? `<pre>${esc(a.prompt)}</pre>` : ""}</article>`).join("")
    : `<p class="empty">아직 이 수조에서 한 일이 없어요.</p>`}<p><button onclick="this.closest('dialog').close()">닫기</button></p>`;
  d.showModal();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-thread]"); if (b) { pick = b.dataset.thread; render(); return; }
  const t = e.target.closest(".tank"); if (t) open(t.dataset.type); });
document.addEventListener("keydown", e => { const t = e.target.closest?.(".tank"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(t.dataset.type); } });

let seen = "";
async function poll() {
  try {
    const text = await (await fetch("/api/state", { cache: "no-store" })).text();
    if (text !== seen) { seen = text; last = JSON.parse(text); build(last.roles || []); render(); }  // 바뀐 때만 다시 그림(애니메이션·스크롤 유지)
    document.getElementById("tick").textContent = new Date().toTimeString().slice(0, 8) + " 갱신";
  } catch { document.getElementById("summary").textContent = "서버에 연결하지 못했어요. Claude Code 세션을 새로 열거나 python3 server.py로 켜 주세요"; }
}
poll(); setInterval(poll, 3000);
// 가려진 탭은 브라우저가 타이머를 늦추므로, 다시 보이면 바로 받아 온다
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
window.addEventListener("focus", poll);
</script>
</body>
</html>
